<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Page Not Found | Sanjana G</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        const saved = localStorage.getItem('sg-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme =
          saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light';
      })();
    </script>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
      </head>
  <body>
    <main class="not-found">
      <div class="container not-found__inner">
        <p class="section__eyebrow">Error 404 · Undefined Coordinate</p>
        <h1 class="not-found__title">That point isn’t on this graph.</h1>
        <p class="not-found__text">
          The page you followed may have moved or the URL has a typo. Head back to the main portfolio to browse projects and contact details.
        </p>
        <a class="btn btn--primary" href="/">Return home</a>
      </div>
    </main>
  </body>
</html>
